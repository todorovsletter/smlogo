<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MR S and MS M</title>
    <style>
        @font-face {
            font-family: "pausa";
            src: url("/smlogo/fonts/pausa-700.ttf") format("truetype");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "pausa";
            src: url("/smlogo/fonts/pausa.ttf") format("truetype");
            font-weight: 400;
            font-style: italic;
            font-display: swap;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            font-family: "pausa";
            font-weight: 700;
        }
        h1 {
            display: flex;
            font-size: 108px;
        }
        #s {
            color: #B50338;
        }
        #and {
            color: #0A1016;
            font-weight: 400;
        }
        #m {
            color: #3596B1;
        }
    </style>
</head>
<body>
    <h1>
        <span id="s">MR S</span>
        <span id="and">and</span>
        <span id="m">MS M</span>
    </h1>
</body>
</html>
