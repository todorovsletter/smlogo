<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MR S and MS M</title>
    <style>
        @font-face {
            font-family: "pausa";
            src: url("/smlogo/fonts/pausa-700.ttf") format("truetype");
            font-weight: 700;
            font-display: swap;
        }
        @font-face {
            font-family: "pausa";
            src: url("/smlogo/fonts/pausa.ttf") format("truetype");
            font-weight: 400;
            font-display: swap;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            font-family: "pausa";
            font-weight: 700;
            white-space: nowrap;
        }
        body {
            padding: 3.5px 0;
        }
        h1 {
            display: flex;
            align-items: center;
            margin: 0;
            font-size: 216px;
            line-height: 1;
        }
        h1 span {
            text-box-trim: trim-both;
            text-box-edge: cap alphabetic;
            display: block;
        }
        #s, #m {
            word-spacing: -.125em;
            letter-spacing: -9.039px;
        }
        #s {
            color: #B50338;
            margin-right: -9px;
        }
        #and {
            margin: 0 .375em;
            color: #0A1016;
            font-size: 88.8px;
            font-weight: 400;
            writing-mode: sideways-lr;
        }
        #m {
            color: #3596B1;
            margin-left: -4.5px;
        }
    </style>
</head>
<body>
    <h1>
        <span id="s">MR S</span>
        <span id="and">and</span>
        <span id="m">MS M</span>
    </h1>
</body>
</html>
